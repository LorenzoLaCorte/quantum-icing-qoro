# Render Blueprint: the hackathon website is a static site, no build step.
services:
  - type: web
    name: quantum-icing
    runtime: static
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: ./code/website
    headers:
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
